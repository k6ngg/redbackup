[package]
name = "redbackup"
version = "0.2.0"
edition = "2021"
default-run = "redbackup"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Fundamental crates conforme AGENTS.md e technical_specifications.md
rusqlite = { version = "0.31", features = ["backup"] }
notify = "6.1"
fastcdc = "5.0"
blake3 = "1.5"
zstd = "0.13"
aes-gcm = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3.10"
rand = "0.8"
filetime = "0.2"
fs2 = "0.4"

[dev-dependencies]
# Para testes futuros

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
